# keeps the SHA-pinned actions, the Python dev tools and Checkov up to date (weekly PRs)
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/tf-init"]
    schedule:
      interval: weekly

  # pyproject.toml and uv.lock of the Lambda and the inventory tool
  - package-ecosystem: uv
    directories: ["/workloads/weather-ingest", "/tools/org-inventory"]
    schedule:
      interval: weekly

  # Checkov version for the lint job
  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: weekly
