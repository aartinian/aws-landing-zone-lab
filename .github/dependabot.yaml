# keeps the SHA-pinned actions, the Python dev tools and Checkov up to date (weekly PRs)
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/tf-init"]
    schedule:
      interval: weekly

  # pyproject.toml and uv.lock of the Lambda and the tools
  - package-ecosystem: uv
    directories:
      - /workloads/weather-ingest
      - /workloads/weather-parse
      - /tools/org-inventory
      - /tools/lab-tools
    schedule:
      interval: weekly

  # Checkov version for the lint job
  - package-ecosystem: pip
    directory: /.github/lint
    schedule:
      interval: weekly
