name: terraform init
description: >-
  Install Terraform, assume an AWS role via OIDC, mask account data
  and init one root module.

inputs:
  root:
    description: root module directory, e.g. live/organization.
    required: true
  role-arn:
    description: IAM role to assume (plan or apply role).
    required: true
  state-bucket:
    description: S3 bucket holding the Terraform state
    required: true

runs:
  using: composite
  steps:
    - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
      with:
        terraform_version: ${{ env.TF_VERSION }}
        terraform_wrapper: false

    # the aws-region makes the action use the regional STS endpoint,
    # which is required in the opt-in Region eu-central-2
    - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.role-arn }}
        aws-region: ${{ env.AWS_REGION }}
        role-session-name: gha-${{ github.run_id }}
        mask-aws-account-id: true

    # logs of a public repo are public: hide account IDs and emails, the
    # management account name, and the organization and root IDs before
    # Terraform prints anything
    - name: Mask organization data
      shell: bash
      run: |
        accounts=$(
          aws organizations list-accounts \
            --query 'Accounts[].[Id,Email]' \
            --output text
        )
        org=$(
          aws organizations describe-organization \
            --query 'Organization.[Id,MasterAccountId]' \
            --output text
        )
        read -r org_id mgmt_id <<< "${org}"
        mgmt_name=$(
          aws organizations describe-account \
            --account-id "${mgmt_id}" \
            --query 'Account.Name' \
            --output text
        )
        root_id=$(
          aws organizations list-roots \
            --query 'Roots[0].Id' \
            --output text
        )

        for value in ${accounts} "${org_id}" "${root_id}"; do
          echo "::add-mask::${value}"
        done
        # the name may contain spaces, mask it as one value
        echo "::add-mask::${mgmt_name}"

    - name: terraform init
      shell: bash
      working-directory: ${{ inputs.root }}
      env:
        STATE_BUCKET: ${{ inputs.state-bucket }}
      run: |
        terraform init -no-color \
          -backend-config="bucket=${STATE_BUCKET}"
