# terraform workflow for the root modules in live/
#   always          -> fmt, Python lint and tests of the workloads
#   pull request    -> fmt, validate, plan (read-only role)
#   merge to master -> one approval in the GitHub environment "prod", then
#                      plan + apply (admin role) of every changed root, in order
#
# note: bootstrap/ is not part of the pipeline, it is applied by hand

name: terraform

on:
  # every PR, so the required checks always report (no paths filter)
  pull_request:
    branches: [master]
  push:
    branches: [master]
    paths: ["live/**", "modules/**", "workloads/**", ".github/**"]

permissions:
  contents: read

# one run at a time per branch, never cancel a running Terraform (state lock)
concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

# explicit bash adds -o pipefail, so a failing terraform before "| sed" fails the step
defaults:
  run:
    shell: bash

env:
  AWS_REGION: eu-central-2
  TF_VERSION: 1.16.4
  TF_IN_AUTOMATION: "true"
  TF_INPUT: "false"

jobs:
  checks:
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.roots.outputs.roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: terraform fmt
        run: terraform fmt -check -recursive -diff

      # every directory live/<component> with .tf files is a root module
      - name: Find root modules
        id: roots
        run: |
          roots=$(
            find live -mindepth 2 -maxdepth 2 -name '*.tf' -exec dirname {} \; \
              | sort -u \
              | jq -Rnc '[inputs]'
          )
          echo "roots=${roots}" >> "$GITHUB_OUTPUT"
          echo "root modules: ${roots}"

  # Lambda code: lint, format and unit tests (no AWS access needed)
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: workloads/weather-ingest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"

      # dev tools are pinned in pyproject.toml ([dependency-groups], needs pip >= 25.1)
      - name: Install dev tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install --group dev

      - name: ruff
        run: |
          ruff check --output-format=github .
          ruff format --check .

      - name: pytest
        run: pytest -q

  # proves on every pull request that GitHub can assume the plan role,
  # even when there is no root module to plan yet
  oidc:
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: gha-${{ github.run_id }}
          mask-aws-account-id: true

      - name: Who am I
        run: aws sts get-caller-identity --query Arn --output text

  plan:
    name: plan (${{ matrix.root }})
    needs: checks
    # fork PRs get no OIDC token, skip instead of failing
    if: >-
      github.event_name == 'pull_request'
      && github.event.pull_request.head.repo.full_name == github.repository
      && needs.checks.outputs.roots != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.checks.outputs.roots) }}
    # job defaults replace the workflow defaults, so repeat the shell (pipefail)
    defaults:
      run:
        shell: bash
        working-directory: ${{ matrix.root }}
    env:
      TF_VAR_account_email_base: ${{ secrets.ACCOUNT_EMAIL_BASE }}
      TF_VAR_admin_user_name: ${{ secrets.IDENTITY_ADMIN_USER_NAME }}
      # read-only role in member accounts, deployed by the organization StackSet
      TF_VAR_member_role_name: awslab-terraform-plan
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tf-init
        with:
          root: ${{ matrix.root }}
          role-arn: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}

      - name: terraform validate
        run: terraform validate -no-color

      # new IDs are not known to the masking step: hide all account and OU IDs by pattern
      - name: terraform plan
        run: |
          terraform plan -no-color -lock-timeout=2m -out=tfplan \
            | sed -E \
                -e 's/[0-9]{12}/<account-id>/g' \
                -e 's/ou-[a-z0-9]{4,32}-[a-z0-9]{8,32}/<ou-id>/g'

      # only the summary line, the full plan stays in the masked job log
      # (summaries and PR comments are not masked)
      - name: Summary
        env:
          ROOT: ${{ matrix.root }}
        run: |
          result=$(
            terraform show -no-color tfplan \
              | grep -E '^(Plan:|No changes)' \
              || true
          )
          echo "**${ROOT}**: ${result:-see job log}" >> "$GITHUB_STEP_SUMMARY"

  # one job and one approval for all roots: they run in order (alphabetical, so
  # workload-dev before workload-prod), roots without changes are skipped and
  # the first error stops the rest
  apply:
    needs: [checks, python]
    if: github.event_name == 'push' && needs.checks.outputs.roots != '[]'
    runs-on: ubuntu-latest
    # required reviewer: the job waits here until approved
    environment: prod
    permissions:
      contents: read
      id-token: write
    env:
      TF_VAR_account_email_base: ${{ secrets.ACCOUNT_EMAIL_BASE }}
      TF_VAR_admin_user_name: ${{ secrets.IDENTITY_ADMIN_USER_NAME }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/tf-init
        with:
          role-arn: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          state-bucket: ${{ secrets.TF_STATE_BUCKET }}

      - name: Plan and apply each root
        env:
          ROOTS: ${{ needs.checks.outputs.roots }}
          STATE_BUCKET: ${{ secrets.TF_STATE_BUCKET }}
        run: |
          mapfile -t roots < <(jq -r '.[]' <<< "${ROOTS}")
          .github/scripts/apply-roots.sh "${roots[@]}"
