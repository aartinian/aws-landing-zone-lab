[project]
name = "weather-parse"
version = "0.1.0"
description = "Daily summary of the ingested SwissMetNet files (S3 → SQS → Lambda in the shared VPC)"
requires-python = ">=3.12"

[dependency-groups]
dev = ["boto3==1.44.12", "moto==5.2.6", "pytest==9.2.0", "ruff==0.17.5"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
