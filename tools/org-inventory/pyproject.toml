[project]
name = "org-inventory"
version = "0.1.0"
description = "Organization inventory: checks every account against the landing zone baseline"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.44.4",
    "pyyaml>=6.0.3",
]

[project.scripts]
org-inventory = "org_inventory.cli:main"

[dependency-groups]
dev = ["pytest==9.2.0", "ruff==0.17.5"]

[build-system]
requires = ["uv_build>=0.12,<0.13"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"] # assert is how pytest checks

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
