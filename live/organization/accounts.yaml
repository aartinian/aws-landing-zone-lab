# account vending: one entry per member account
#   ou:                  Security | Infrastructure | Workloads | Sandbox | Suspended
#   owner:               team responsible for the account
#   env:                 dev | prod
#   data-classification: public | internal | confidential (ISG, see tagging.yaml)

log-archive:
  ou: Security
  owner: platform
  env: prod
  data-classification: internal

security-tooling:
  ou: Security
  owner: platform
  env: prod
  data-classification: internal

network:
  ou: Infrastructure
  owner: platform
  env: prod
  data-classification: internal

workload-dev:
  ou: Workloads
  owner: weather-data
  env: dev
  data-classification: public

workload-prod:
  ou: Workloads
  owner: weather-data
  env: prod
  data-classification: public
